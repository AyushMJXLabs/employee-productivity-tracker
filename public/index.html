<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MJX Labs · Work Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Loading workspace…</span>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Modal for editing a log entry or resetting a member's password -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title"></h3>
          <button type="button" id="modal-close" class="icon-btn" aria-label="Close modal">
            &times;
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
