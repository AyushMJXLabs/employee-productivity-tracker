services:
  - type: web
    name: MJXLabs-Employee-Productivity-Tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TITLE
        value: MJX Labs · Work Ledger
      - key: SESSION_SECRET
        generateValue: true
      - key: TEAM_INVITE_CODE
        value: MJX-TEAM-2026
      - key: BOSS_NAME
        value: Internship Lead
      - key: BOSS_EMAIL
        sync: false
      - key: BOSS_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mjx-work-ledger-db
          property: connectionString

databases:
  - name: mjx-work-ledger-db
    plan: free
    databaseName: work_ledger
    user: work_ledger_user
